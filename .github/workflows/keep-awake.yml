# Keeps the free Supabase database awake by reading one row every 3 days.
# Uses only the PUBLIC key (the same one already in assets/config.js).
name: Keep database awake

on:
  schedule:
    - cron: '17 3 */3 * *'   # every 3 days, 11:17 am Singapore time
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://gplhqwrxaxhxrzeterje.supabase.co/rest/v1/groups?select=id&limit=1" \
            -H "apikey: sb_publishable_LLrdycId3FDMnfS1r_yZqQ_OEgoYrbt")
          echo "Database answered: $code"
          test "$code" = "200"
